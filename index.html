<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Internety — Data Management, Business Intelligence & Hosting</title>

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="internety.ico">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #f5f5f5;
            font-family: Arial, Helvetica, sans-serif;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }

        .container {
            background: #ffffff;
            padding: 40px 60px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            opacity: 0;
            transform: translateY(20px);
            animation: fadeIn 1.2s ease forwards;
        }

        img {
            width: 180px;
            margin-bottom: 20px;
        }

        p {
            font-size: 18px;
            color: #555;
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <img src="logoY.png" alt="Internety Logo">
        <p>Data Management, Business Intelligence & Hosting</p>
    </div>
</body>
</html>
