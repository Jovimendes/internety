<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Internety — Data Management, Business Intelligence & Hosting</title>

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="internety.ico">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #f5f5f5;
            font-family: Arial, Helvetica, sans-serif;
            color: #333;
            text-align: center;
            min-height: 100vh;
            padding-bottom: 52px; /* evita que o rodapé cubra o conteúdo */
        }

        .main {
            min-height: calc(100vh - 52px);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
        }

        .container {
            background: #ffffff;
            padding: 40px 60px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            opacity: 0;
            transform: translateY(20px);
            animation: fadeIn 1.2s ease forwards;
        }

        .container a {
            display: inline-block;
        }

        img {
            width: 250px;
            max-width: 100%;
            margin-bottom: 20px;
            cursor: pointer;
        }

        p {
            font-size: 14px;
            color: #555;
        }

        footer {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: #333;
            color: #fff;
            text-align: center;
            padding: 12px 10px;
            font-size: 13px;
            border-top: 2px solid #ccc;
            z-index: 1000;
        }

        footer span {
            opacity: 0.9;
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>
    <main class="main">
        <div class="container">
            <a href="mailto:contato@internety.com.br">
                <img src="logoY.png" alt="Internety Logo">
            </a>
            <p>Data Management, Business Intelligence & Hosting</p>
        </div>
    </main>

    <footer>
        <span>© 2026 - Internety.com.br | Data | BI | Hosting</span>
    </footer>
</body>
</html>
